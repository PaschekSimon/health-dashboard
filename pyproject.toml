[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-dashboard"
version = "1.1.0"
description = "Local Google Health dashboard with WHOOP-style scores, an API and an MCP server."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"  # google-health-mcp needs 3.13
dependencies = [
    # Google login, API paging and the daily cache. Pinned to Simon's fork in
    # [tool.uv.sources]; uv.lock records the exact commit, so `uv sync` never
    # moves it. Update on purpose with: uv lock --upgrade-package google-health-mcp
    "google-health-mcp",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
health = "health_dashboard.cli:main"

[tool.uv.sources]
google-health-mcp = { git = "https://github.com/PaschekSimon/google-health-mcp", branch = "simon" }

[tool.hatch.build.targets.wheel]
packages = ["src/health_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/smoke"]  # live checks against a running backend, run by hand
