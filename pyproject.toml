[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-dashboard"
version = "1.1.0"
description = "Local Google Health dashboard with WHOOP-style scores, an API and an MCP server."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
health = "health_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/health_dashboard"]

[tool.pytest.ini_options]
# The suite runs on synthetic data (tests/fixture_db.py). tests/smoke/ holds
# live checks against a running backend and your real data, run by hand.
testpaths = ["tests"]
pythonpath = ["tests"]
norecursedirs = ["smoke", ".*", "__pycache__"]
