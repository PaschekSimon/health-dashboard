# Lint and run the test suite (synthetic data, no personal data) on every push
# and pull request, on Linux and Windows so the golden scores match on both.
name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff fastapi httpx
      - run: ruff check .
      - run: python -m pytest
