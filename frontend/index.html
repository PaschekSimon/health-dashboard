<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23111' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="island-wrap">
    <div class="island" id="island">
      <a class="brand" href="#/dashboard" aria-label="Health, dashboard">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" class="mark-track"/><path d="M12 3a9 9 0 0 1 8.2 12.7" class="mark-arc"/></svg>
        <span>Health</span>
      </a>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <div class="menu" id="side">
        <nav id="tabs" aria-label="Sections"></nav>
        <div class="sync" id="sync">
          <span class="dot"></span><span class="txt" id="sync-text">…</span>
          <button class="btn primary cta" id="sync-btn" title="Fetch new data from Google Health now">Sync now<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg></span></button>
        </div>
      </div>
      <span class="dot" id="top-dot"></span>
      <button class="burger" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="side"><span></span><span></span></button>
    </div>
  </header>
  <main id="view"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
